<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            color: #ff6600;
        }

        p {
            color: #555;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #0078d7;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005cbf;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Jenkins CI/CD Demo 🚀</h1>
        <p>Website deployed using GitHub + Jenkins + Apache</p>
        <button onclick="alert('Deployment Successful!')">
            Click Me
        </button>
    </div>

</body>
</html>
